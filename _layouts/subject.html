---
layout: default
---
{%- assign subject = site.data.subjects | where: "slug", page.subject | first -%}
<article class="post">
  <header class="post-header">
    <p class="post-meta"><a href="{{ '/daily-dev-coding/' | relative_url }}">Daily Dev Coding</a></p>
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  <div class="post-content">
    {% if subject.summary %}
    <p>{{ subject.summary | escape }}</p>
    {% endif %}
    {% include mission-list.html slug=page.subject %}
    {{ content }}
  </div>
</article>
