---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  <div class="post-content">
    <p>Daily mission notes, grouped by subject.</p>
    {% for subject in site.data.subjects %}
    <section class="subject-group" id="{{ subject.slug }}">
      <h2><a href="{{ '/daily-dev-coding/' | append: subject.slug | append: '/' | relative_url }}">{{ subject.title | escape }}</a></h2>
      <p>{{ subject.summary | escape }}</p>
      {% include mission-list.html slug=subject.slug %}
    </section>
    {% endfor %}
    {{ content }}
  </div>
</article>
